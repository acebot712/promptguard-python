name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Default to read-only. id-token: write is escalated only on the
# publish job that actually needs PyPI Trusted Publishing OIDC.
permissions:
  contents: read

# Only one publish at a time -- never two concurrent publishes of
# the same version. Don't cancel in progress: a half-rolled-back
# publish is worse than two queued.
concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # A CHANGELOG is only worth having if it is written when the release is
      # cut. This fails the release rather than letting a version ship with no
      # entry -- reconstructing them afterwards produces a list of tag subjects,
      # which is what every entry below 1.11.1 already is.
      - name: CHANGELOG has an entry for this version
        run: python scripts/check_changelog.py

      - name: Lint
        run: |
          pip install ruff==0.15.20
          ruff check .
          ruff format --check .

      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v

      - name: Build
        run: |
          pip install build
          python -m build

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    # PyPI Trusted Publishing needs id-token: write to mint the OIDC
    # token. contents: read is for checkout. Nothing else escalates.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Get version
        id: version
        run: |
          # Version is single-sourced in promptguard/_version.py (hatch reads
          # it via [tool.hatch.version]); pyproject no longer carries it.
          # Parse the file directly so we don't import the package (and its
          # httpx dependency, which isn't installed in this job).
          VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', pathlib.Path('promptguard/_version.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on PyPI
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # `pip index` (experimental) prints a single "Available versions: a, b, c"
          # line. Parse it into one version per line and match the exact token,
          # so e.g. 1.9.0 never matches 1.9.01 or 11.9.0. Fail loudly if the
          # command itself errors rather than silently treating that as "new".
          if ! AVAILABLE=$(pip index versions promptguard-sdk 2>/dev/null); then
            echo "pip index versions failed" >&2
            exit 1
          fi
          if printf '%s\n' "$AVAILABLE" \
            | sed -n 's/.*Available versions: //p' \
            | tr ',' '\n' \
            | tr -d '[:space:]' \
            | grep -qx -- "$VERSION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: |
          pip install build
          python -m build

      - name: Publish (Trusted Publishing)
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Tells Slack #releases this version is on PyPI (ADR-0038 in the platform
  # repo). Only after a real publish, never for a re-run that found the
  # version already there. It cannot fail the release: the job is
  # continue-on-error and post-release.sh exits 0 on every failure, with a
  # warning (an unset SLACK_RELEASES_WEBHOOK_URL included).
  announce:
    name: Announce in #releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    if: needs.publish.outputs.published == 'true'
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Workload Identity, to read the webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      # Secret Manager is the only store; GitHub holds no secrets. This repo
      # reads as itself (direct Workload Identity Federation, no service account).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Read secrets from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SLACK_RELEASES_WEBHOOK_URL:promptguard-production-472014/SLACK_RELEASES_WEBHOOK_URL
      - name: Post to #releases
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ steps.secrets.outputs.SLACK_RELEASES_WEBHOOK_URL }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          scripts/post-release.sh "Python SDK" "v${VERSION}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION} · https://pypi.org/project/promptguard-sdk/${VERSION}/"
