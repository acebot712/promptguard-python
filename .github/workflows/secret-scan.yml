name: Secret scan

# Deliberately NOT part of ci.yml, and deliberately without `paths-ignore`.
#
# ci.yml skips markdown-only and docs-only commits, which is right for build and
# test jobs and wrong for this one: a credential pasted into a README or a
# runbook is still a credential, and that is exactly the commit those filters
# wave through. Kept separate so it cannot inherit a path filter by accident,
# and so a red scan is unambiguous rather than one failure among many.
#
# This repository is public. A credential that reaches the default branch is
# world-readable immediately and has to be ROTATED, not reverted -- so the gate
# that matters is the one nobody can skip. The .githooks / pre-commit hook is
# the fast local courtesy; `git push --no-verify` walks straight past it.
#
# gitleaks scans the pushed range on a push and the PR range on a pull
# request; it never scans history, which is why it does not drown in the
# credential-shaped strings this codebase carries on purpose. Those live in
# .gitleaks.toml where the repo has one.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # gitleaks scans a range, so it needs the history that range
          # refers to; the default shallow clone makes it scan nothing.
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Secret scan (gitleaks)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The gitleaks CLI, not gitleaks-action: the action demands a paid licence
          # key once a repo belongs to an organisation (promptguardhq, since
          # 2026-11-01), and GitHub holds no secrets. Same scanner, same
          # .gitleaks.toml and .gitleaksignore, same range: the PR's commits, or the
          # pushed ones (only the tip when a push creates the branch).
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD"
          else
            range="-1 $HEAD"
          fi
          ./gitleaks git --redact --verbose --log-opts="$range" .
