name: Sync Types from API Spec

on:
  # Weekly check for spec drift. The OpenAPI spec is published publicly
  # at https://docs.promptguard.co/api-reference/openapi-developer.json
  # so we don't need a cross-repo dispatch from the monorepo (which
  # required a fine-grained PAT we never set up). Pull-based, no auth,
  # no token-rotation surface, runs on the public Actions tier.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

# Workflow-level: minimal. Job-level escalates to write where needed.
permissions:
  contents: read

# Only one sync at a time -- two parallel runs would race on the
# branch + PR creation.
concurrency:
  group: sync-types
  cancel-in-progress: false

jobs:
  # See ./_sync-from-api.yml -- shared with promptguard-node, which calls
  # this same file remotely. Hosted here rather than a dedicated shared-infra
  # repo: two callers today doesn't clear the bar for a third repo.
  sync-types:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_sync-from-api.yml
    with:
      runtime: python
      install-command: pip install -e ".[dev]"
      generate-types-command: python scripts/generate_types_from_spec.py openapi-developer.json
      adopt-contract-command: python scripts/sync_guard_contract.py guard-contract.upstream.json
      validate-command: |
        ruff check .
        pytest tests/ -v
      generated-types-path: promptguard/generated/
      generated-types-file-label: promptguard/generated/api_types.py
      sibling-sdk-name: the Node SDK
