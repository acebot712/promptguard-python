repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep equal to the ruff==X pin in pyproject.toml [dev]; CI installs that pin
    hooks:
      - id: ruff
        stages: [pre-commit]
        args: [--fix]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      # Secret scanning at PUSH time. This package is published to PyPI and the
      # repo is public, so a credential reaching main is world-readable at once.
      # CI scans too (.github/workflows/secret-scan.yml); this catches it before
      # the push, while the commit can still be amended instead of rotated.
      - id: gitleaks-push
        name: Secret scan the commits being pushed (gitleaks)
        entry: scripts/hooks/gitleaks-push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

# A hook with no `stages` runs at every stage, so the hooks above are pinned to
# pre-commit and the scan to pre-push.
default_install_hook_types: [pre-commit, pre-push]
