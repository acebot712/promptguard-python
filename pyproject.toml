[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptguard-sdk"
dynamic = ["version"]
description = "Drop-in security for AI applications - AI Firewall SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PromptGuard", email = "support@promptguard.co" }
]
keywords = [
    "ai",
    "security",
    "llm",
    "prompt-injection",
    "openai",
    "anthropic",
    "ai-firewall",
    "pii-detection",
    "llm-security",
    "ai-security",
    "langchain",
    "crewai",
    "llamaindex",
    "auto-instrumentation",
    "genai-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
crewai = [
    "crewai>=0.28.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
all = [
    "langchain-core>=0.1.0",
    "crewai>=0.28.0",
    "llama-index-core>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.0.0",
    "ruff==0.16.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://promptguard.co"
Documentation = "https://docs.promptguard.co"
Repository = "https://github.com/acebot712/promptguard-python"
Issues = "https://github.com/acebot712/promptguard-python/issues"

[tool.hatch.version]
path = "promptguard/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["promptguard"]
# Ship the PEP 561 marker so downstream mypy/pyright treat the SDK as typed.
artifacts = ["promptguard/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "S",      # bandit (security)
    "T20",    # no print statements
    "PTH",    # pathlib
    "PIE",    # misc lints
    "RET",    # return consistency
    "PERF",   # performance
    "TCH",    # type-checking imports
    "RUF",    # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Generated by scripts/generate_types_from_spec.py from the published OpenAPI
# spec. Its docstrings and comments are the spec's own `description` strings,
# reproduced verbatim so the type carries the API's wording, and the spec is
# free to write a 190-character sentence.
#
# This is not a style preference. `sync-from-api.yml` regenerates this file and
# then runs `ruff check .` to prove the SDK still works. When a description
# crossed 100 characters the lint failed, the workflow died BEFORE its "create
# PR" step, and the sync could no longer land anything -- so the failure mode
# was not "ugly generated code", it was a types pipeline that silently stopped
# delivering. Every scheduled run from 2026-04-27 to 2026-08-10 failed this way,
# 16 in a row, while the committed types fell 327 lines behind the live spec.
"promptguard/generated/*.py" = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["promptguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["promptguard"]
omit = ["promptguard/generated/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
